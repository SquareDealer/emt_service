services:
  db:
    image: postgres:16
    container_name: tatarin_pg
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: tatarin_crm
    ports:
      - "5544:5432"
    volumes:
      - tatarin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d tatarin_crm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tatarin_pgdata:
